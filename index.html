<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>カウンター</title>
        <style>
            :root {
                --primary-color: #007bff;
                --danger-color: #dc3545;
                --success-color: #28a745;
                --orange-color: #fd7e14;
                --dark-color: #343a40;
                --light-color: #f8f9fa;
            }
            body {
                font-family: "Helvetica Neue", Arial, sans-serif;
                margin: 0;
                padding: 20px;
                background-color: #e9ecef;
                color: var(--dark-color);
            }
            .container {
                max-width: 700px;
                margin: 0 auto;
                background: white;
                padding: 30px;
                border-radius: 12px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }
            h1 {
                text-align: center;
                margin-bottom: 25px;
                font-size: 24px;
            }
            .counter-section {
                display: flex;
                gap: 20px;
                margin-bottom: 30px;
            }
            .btn-count {
                flex: 1;
                font-size: 24px;
                padding: 20px 0;
                color: white;
                border: none;
                border-radius: 50px;
                cursor: pointer;
                transition:
                    transform 0.1s,
                    opacity 0.2s;
                font-weight: bold;
            }
            .btn-in {
                background-color: var(--primary-color);
                box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
            }
            .btn-out {
                background-color: var(--orange-color);
                box-shadow: 0 4px 15px rgba(253, 126, 20, 0.4);
            }
            .btn-count:active {
                transform: scale(0.98);
            }
            .btn-count:hover {
                opacity: 0.9;
            }
            .stats-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 15px;
                margin-bottom: 30px;
                text-align: center;
            }
            .stat-card {
                background: var(--light-color);
                padding: 12px;
                border-radius: 8px;
                border: 1px solid #dee2e6;
            }
            .stat-card .label {
                font-size: 12px;
                color: #6c757d;
                margin-bottom: 5px;
                font-weight: bold;
            }
            .stat-card .value-sub {
                font-size: 14px;
                color: #495057;
                margin-top: 4px;
            }
            .actions {
                display: flex;
                gap: 15px;
                margin-bottom: 30px;
            }
            .btn {
                flex: 1;
                padding: 12px;
                font-size: 16px;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-weight: bold;
                transition: opacity 0.2s;
            }
            .btn:hover {
                opacity: 0.9;
            }
            .btn-csv {
                background-color: var(--success-color);
                color: white;
            }
            .btn-reset {
                background-color: var(--danger-color);
                color: white;
            }
            .log-section {
                border-top: 2px solid #dee2e6;
                padding-top: 20px;
            }
            .log-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 15px;
            }
            .log-title {
                font-size: 18px;
                margin: 0;
            }
            .badges {
                display: flex;
                gap: 8px;
            }
            .badge {
                color: white;
                padding: 4px 10px;
                border-radius: 20px;
                font-size: 13px;
                font-weight: bold;
            }
            .badge-total-in {
                background-color: var(--primary-color);
            }
            .badge-total-out {
                background-color: var(--orange-color);
            }
            .badge-current {
                background-color: var(--dark-color);
            }

            /* 履歴の並列表示用のレイアウト */
            .log-columns {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }
            .column-title {
                font-size: 14px;
                font-weight: bold;
                margin-bottom: 8px;
                text-align: center;
                padding: 6px;
                border-radius: 4px;
                color: white;
            }
            .column-title.in {
                background-color: var(--primary-color);
            }
            .column-title.out {
                background-color: var(--orange-color);
            }

            .log-container {
                max-height: 250px;
                overflow-y: auto;
                border: 1px solid #dee2e6;
                border-radius: 6px;
                background: var(--light-color);
                min-height: 100px;
            }
            .log-item {
                display: flex;
                justify-content: space-between;
                padding: 8px 12px;
                border-bottom: 1px solid #dee2e6;
                font-family: monospace;
                font-size: 13px;
            }
            .log-item:last-child {
                border-bottom: none;
            }
            .log-item:nth-child(even) {
                background-color: #fff;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>カウンター</h1>
            <!-- カウントボタン（2系統化） -->
            <div class="counter-section">
                <button id="inBtn" class="btn-count btn-in">IN</button>
                <button id="outBtn" class="btn-count btn-out">OUT</button>
            </div>

            <!-- 直近の統計値情報 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="label">直近1分</div>
                    <div id="stat1m" class="value-sub">IN: 0 / OUT: 0</div>
                </div>
                <div class="stat-card">
                    <div class="label">直近3分</div>
                    <div id="stat3m" class="value-sub">IN: 0 / OUT: 0</div>
                </div>
                <div class="stat-card">
                    <div class="label">直近5分</div>
                    <div id="stat5m" class="value-sub">IN: 0 / OUT: 0</div>
                </div>
            </div>

            <!-- 操作ボタン -->
            <div class="actions">
                <button id="csvBtn" class="btn btn-csv">CSV出力</button>
                <button id="resetBtn" class="btn btn-reset">リセット</button>
            </div>

            <!-- 履歴表示セクション -->
            <div class="log-section">
                <div class="log-header">
                    <h2 class="log-title">記録</h2>
                    <div class="badges">
                        <span id="badgeTotalIn" class="badge badge-total-in">総IN: 0</span>
                        <span id="badgeTotalOut" class="badge badge-total-out">総OUT: 0</span>
                    </div>
                </div>

                <!-- 左右に並んだ表 -->
                <div class="log-columns">
                    <div>
                        <div class="column-title in">IN</div>
                        <div id="inLogContainer" class="log-container"></div>
                    </div>
                    <div>
                        <div class="column-title out">OUT</div>
                        <div id="outLogContainer" class="log-container"></div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            // 状態管理
            let attendanceLog = [];

            // DOM要素の取得
            const inBtn = document.getElementById("inBtn");
            const outBtn = document.getElementById("outBtn");
            const csvBtn = document.getElementById("csvBtn");
            const resetBtn = document.getElementById("resetBtn");
            const inLogContainer = document.getElementById("inLogContainer");
            const outLogContainer = document.getElementById("outLogContainer");
            const badgeTotalIn = document.getElementById("badgeTotalIn");
            const badgeTotalOut = document.getElementById("badgeTotalOut");
            const stat1m = document.getElementById("stat1m");
            const stat3m = document.getElementById("stat3m");
            const stat5m = document.getElementById("stat5m");

            // 日時フォーマット関数 (yyyy-mm-dd hh:mm:ss)
            function formatTimestamp(date) {
                const yyyy = date.getFullYear();
                const mm = String(date.getMonth() + 1).padStart(2, "0");
                const dd = String(date.getDate()).padStart(2, "0");
                const hh = String(date.getHours()).padStart(2, "0");
                const min = String(date.getMinutes()).padStart(2, "0");
                const ss = String(date.getSeconds()).padStart(2, "0");
                return `${yyyy}-${mm}-${dd} ${hh}:${min}:${ss}`;
            }

            // アプリ初期化時のデータ読み込み
            function init() {
                const savedData = localStorage.getItem("attendance_log_v2");
                if (savedData) {
                    try {
                        attendanceLog = JSON.parse(savedData);
                    } catch (e) {
                        attendanceLog = [];
                    }
                }
                updateUI();
                setInterval(updateStats, 1000);
            }

            // ログデータ保存
            function saveData() {
                localStorage.setItem("attendance_log_v2", JSON.stringify(attendanceLog));
            }

            // カウント追加処理（typeには 'IN' または 'OUT' が入る）
            function addRecord(type) {
                const now = new Date();

                // それぞれのタイプの現在のカウント数を計算
                const currentTypeCount = attendanceLog.filter((item) => item.type === type).length + 1;

                const newRecord = {
                    typeCount: currentTypeCount,
                    type: type,
                    timestamp: formatTimestamp(now),
                    isoString: now.toISOString(),
                };

                // 配列の先頭に追加
                attendanceLog.unshift(newRecord);

                saveData();
                updateUI();
            }

            // 画面表示（UI）の全体更新
            function updateUI() {
                // INとOUTの配列をそれぞれ分離
                const inRecords = attendanceLog.filter((item) => item.type === "IN");
                const outRecords = attendanceLog.filter((item) => item.type === "OUT");

                // バッジ（合計数・現在店内人数）の更新
                badgeTotalIn.textContent = `総IN: ${inRecords.length}`;
                badgeTotalOut.textContent = `総OUT: ${outRecords.length}`;

                // 入場履歴 (IN) の描画
                renderLogBox(inLogContainer, inRecords, "var(--primary-color)");
                // 退場履歴 (OUT) の描画
                renderLogBox(outLogContainer, outRecords, "var(--orange-color)");
                // 直近統計の更新
                updateStats();
            }
            // 履歴ボックス描画ヘルパー
            function renderLogBox(container, records, color) {
                container.innerHTML = "";
                if (records.length === 0) {
                    container.innerHTML = "";
                } else {
                    records.forEach((item) => {
                        const div = document.createElement("div");
                        div.className = "log-item";
                        div.innerHTML = `<span style="font-weight:bold; color:${color};">#${item.typeCount}</span> <span>${item.timestamp}</span>`;
                        container.appendChild(div);
                    });
                }
            }
            // 直近1/3/5分間のカウント算出
            function updateStats() {
                const nowMs = Date.now();
                const oneMinMs = 60 * 1000;
                const threeMinMs = 3 * 60 * 1000;
                const fiveMinMs = 5 * 60 * 1000;
                let in1m = 0,
                    out1m = 0;
                let in3m = 0,
                    out3m = 0;
                let in5m = 0,
                    out5m = 0;
                attendanceLog.forEach((item) => {
                    const itemMs = new Date(item.isoString).getTime();
                    const diffMs = nowMs - itemMs;
                    if (diffMs <= oneMinMs) {
                        if (item.type === "IN") in1m++;
                        else out1m++;
                    }
                    if (diffMs <= threeMinMs) {
                        if (item.type === "IN") in3m++;
                        else out3m++;
                    }
                    if (diffMs <= fiveMinMs) {
                        if (item.type === "IN") in5m++;
                        else out5m++;
                    }
                });
                stat1m.innerHTML = `IN: <b>${in1m}</b> / OUT: <b>${out1m}</b>`;
                stat3m.innerHTML = `IN: <b>${in3m}</b> / OUT: <b>${out3m}</b>`;
                stat5m.innerHTML = `IN: <b>${in5m}</b> / OUT: <b>${out5m}</b>`;
            }
            // CSVダウンロード機能
            function downloadCSV() {
                if (attendanceLog.length === 0) {
                    alert("出力するデータがありません。");
                    return;
                }
                // CSVヘッダー（種別列を追加）
                let csvContent = "種別,種別毎連番,日時\r\n";
                // 発生した古い順（時系列順）に直して出力
                const sortedLog = [...attendanceLog].reverse();
                sortedLog.forEach((item) => {
                    csvContent += `${item.type},${item.typeCount},"${item.timestamp}"\r\n`;
                });
                // ダウンロード処理 (BOM付与)
                const blob = new Blob([new Uint8Array([0xef, 0xbb, 0xbf]), csvContent], { type: "text/csv;charset=utf-8;" });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                const dateStr = formatTimestamp(new Date()).replace(/[: ]/g, "-");
                link.setAttribute("download", `store_traffic_log_${dateStr}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
            // リセット機能
            function resetData() {
                const confirmed = confirm("これまでの入場・退場データをすべて削除しますか？\nこの操作は取り消せません。");
                if (confirmed) {
                    attendanceLog = [];
                    in1m = 0;
                    out1m = 0;
                    in3m = 0;
                    out3m = 0;
                    in5m = 0;
                    out5m = 0;
                    localStorage.removeItem("attendance_log_v2");
                    updateUI();
                }
            }
            // イベントリスナーの登録
            inBtn.addEventListener("click", () => addRecord("IN"));
            outBtn.addEventListener("click", () => addRecord("OUT"));
            csvBtn.addEventListener("click", downloadCSV);
            resetBtn.addEventListener("click", resetData);
            // 起動
            init();
        </script>
    </body>
</html>
