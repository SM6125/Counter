<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>入場者数統計カウンター</title>
  <style>
    :root {
      --primary-color: #007bff;
      --danger-color: #dc3545;
      --success-color: #28a745;
      --dark-color: #343a40;
      --light-color: #f8f9fa;
    }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #e9ecef;
      color: var(--dark-color);
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 24px;
    }

    .counter-section {
      text-align: center;
      margin-bottom: 30px;
    }

    .btn-count {
      font-size: 28px;
      padding: 20px 50px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
      transition: transform 0.1s, background-color 0.2s;
      width: 100%;
    }

    .btn-count:active {
      transform: scale(0.98);
    }

    .btn-count:hover {
      background-color: #0056b3;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 30px;
      text-align: center;
    }

    .stat-card {
      background: var(--light-color);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #dee2e6;
    }

    .stat-card .label {
      font-size: 12px;
      color: #6c757d;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .stat-card .value {
      font-size: 24px;
      font-weight: bold;
      color: var(--dark-color);
    }

    .actions {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-csv {
      background-color: var(--success-color);
      color: white;
    }

    .btn-reset {
      background-color: var(--danger-color);
      color: white;
    }

    .log-section {
      border-top: 2px solid #dee2e6;
      padding-top: 20px;
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .log-title {
      font-size: 18px;
      margin: 0;
    }

    .total-badge {
      background: var(--dark-color);
      color: white;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 14px;
    }

    .log-container {
      max-height: 250px;
      overflow-y: auto;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      background: var(--light-color);
    }

    .log-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 15px;
      border-bottom: 1px solid #dee2e6;
      font-family: monospace;
      font-size: 14px;
    }

    .log-item:last-child {
      border-bottom: none;
    }

    .log-item:nth-child(even) {
      background-color: #fff;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>入場者数統計カウンター</h1>

    <!-- カウントボタン -->
    <div class="counter-section">
      <button id="countBtn" class="btn-count">＋1 人 入場</button>
    </div>

    <!-- 直近の統計値情報 -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">直近1分</div>
        <div id="stat1m" class="value">0</div>
      </div>
      <div class="stat-card">
        <div class="label">直近3分</div>
        <div id="stat3m" class="value">0</div>
      </div>
      <div class="stat-card">
        <div class="label">直近5分</div>
        <div id="stat5m" class="value">0</div>
      </div>
    </div>

    <!-- 操作ボタン -->
    <div class="actions">
      <button id="csvBtn" class="btn btn-csv">CSV出力</button>
      <button id="resetBtn" class="btn btn-reset">リセット</button>
    </div>

    <!-- ラップ風ログ表示 -->
    <div class="log-section">
      <div class="log-header">
        <h2 class="log-title">入場記録（履歴）</h2>
        <span id="totalBadge" class="total-badge">合計: 0人</span>
      </div>
      <div id="logContainer" class="log-container">
        <!-- JavaScriptで動的に追加されます -->
      </div>
    </div>
  </div>

  <script>
    // 状態管理
    let attendanceLog = [];
    // DOM要素の取得
    const countBtn = document.getElementById('countBtn');
    const csvBtn = document.getElementById('csvBtn');
    const resetBtn = document.getElementById('resetBtn');
    const logContainer = document.getElementById('logContainer');
    const totalBadge = document.getElementById('totalBadge');
    const stat1m = document.getElementById('stat1m');
    const stat3m = document.getElementById('stat3m');
    const stat5m = document.getElementById('stat5m');
    // 日時フォーマット関数 (yyyy-mm-dd hh:mm:ss)
    function formatTimestamp(date) {
      const yyyy = date.getFullYear();
      const mm = String(date.getMonth() + 1).padStart(2, '0');
      const dd = String(date.getDate()).padStart(2, '0');
      const hh = String(date.getHours()).padStart(2, '0');
      const min = String(date.getMinutes()).padStart(2, '0');
      const ss = String(date.getSeconds()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd} ${hh}:${min}:${ss}`;
    }
    // アプリ初期化時のデータ読み込み
    function init() {
      const savedData = localStorage.getItem('attendance_log');
      if (savedData) {
        try {
          attendanceLog = JSON.parse(savedData);
        } catch (e) {
          attendanceLog = [];
        }
      }
      updateUI();
      // 1秒ごとに直近の集計表示を更新
      setInterval(updateStats, 1000);
    }
    // ログデータ保存
    function saveData() {
      localStorage.setItem('attendance_log', JSON.stringify(attendanceLog));
    }
    // カウント追加処理
    function addCount() {
      const now = new Date();
      const newRecord = {
        count: attendanceLog.length + 1,
        timestamp: formatTimestamp(now),
        isoString: now.toISOString() // フィルタ用の正確な時間基準
      };
      // 配列の先頭に追加（ラップ表示のように最新を上に）
      attendanceLog.unshift(newRecord);
      saveData();
      updateUI();
    }
    // 画面表示（UI）の全体更新
    function updateUI() {
      // 合計人数の更新
      totalBadge.textContent = `合計: ${attendanceLog.length}人`;
      // ログ一覧の描画
      logContainer.innerHTML = '';
      if (attendanceLog.length === 0) {
        logContainer.innerHTML = '<div class="log-item" style="justify-content:center; color:#6c757d;">データがありません</div>';
      } else {
        attendanceLog.forEach(item => {
          const div = document.createElement('div');
          div.className = 'log-item';
          div.innerHTML = `
                    <span style="font-weight:bold; color:var(--primary-color);">#${item.count}</span>
                    <span>${item.timestamp}</span>
                `;
          logContainer.appendChild(div);
        });
      }
      // 直近統計の更新
      updateStats();
    }
    // 直近1/3/5分間のカウント算出
    function updateStats() {
      const nowMs = Date.now();
      const oneMinMs = 60 * 1000;
      const threeMinMs = 3 * 60 * 1000;
      const fiveMinMs = 5 * 60 * 1000;
      let count1m = 0;
      let count3m = 0;
      let count5m = 0;
      attendanceLog.forEach(item => {
        const itemMs = new Date(item.isoString).getTime();
        const diffMs = nowMs - itemMs;
        if (diffMs <= oneMinMs) count1m++;
        if (diffMs <= threeMinMs) count3m++;
        if (diffMs <= fiveMinMs) count5m++;
      });
      stat1m.textContent = count1m;
      stat3m.textContent = count3m;
      stat5m.textContent = count5m;
    }
    // CSVダウンロード機能
    function downloadCSV() {
      if (attendanceLog.length === 0) {
        alert('出力するデータがありません。');
        return;
      }
      // CSVヘッダーとデータの構築（配列の古い順 = 通し番号順に直して出力するためreverseを使用）
      let csvContent = "BOM_UTF8\uFEFF"; // Excelの文字化け防止用BOM
      csvContent = "通し番号,タイムスタンプ\r\n";
      // 元データを壊さないようにコピーして逆順にする
      const sortedLog = [...attendanceLog].reverse();
      sortedLog.forEach(item => {
        csvContent += `${item.count},"${item.timestamp}"\r\n`;
      });
      // ダウンロード処理
      const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvContent], {
        type: 'text/csv;charset=utf-8;'
      });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      // ファイル名に日付を付与
      const dateStr = formatTimestamp(new Date()).replace(/[: ]/g, '-');
      link.setAttribute("download", `attendance_log_${dateStr}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
    // リセット機能
    function resetData() {
      const confirmed = confirm('これまでの入場者数データをすべて削除しますか？\nこの操作は取り消せません。');
      if (confirmed) {
        attendanceLog = [];
        localStorage.removeItem('attendance_log');
        updateUI();
      }
    }
    // イベントリスナーの登録
    countBtn.addEventListener('click', addCount);
    csvBtn.addEventListener('click', downloadCSV);
    resetBtn.addEventListener('click', resetData);
    // 起動
    init();
  </script>
